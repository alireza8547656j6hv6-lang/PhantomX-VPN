name: build
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir src && unzip -q PhantomX-All.zip -d src
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - name: build
        run: |
          cd src
          gradle assembleDebug --console=plain --stacktrace 2>&1 | tee ../build.log
      - name: error summary
        if: failure()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |error:|What went wrong|Could not|Caused by" -A4 build.log | head -60 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - run: mv src/app/build/outputs/apk/debug/app-debug.apk PhantomX.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhantomX-apk
          path: PhantomX.apk
